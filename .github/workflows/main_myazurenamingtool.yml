name: Build and deploy ASP.Net Core app to Azure Web App - myAzureNamingTool

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 (LTS)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/AzureNamingTool.csproj

      - name: Build
        run: dotnet build src/AzureNamingTool.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/AzureNamingTool.csproj --configuration Release --no-build -o ${{ github.workspace }}/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3EEED51C8B854A968769E5ECD4B0B657 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B1FB1A57B387427EAFA64E5EAC6F6CC1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_038AEED21BFB410A8124D1D66079F3A6 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: myAzureNamingTool
          slot-name: Production
          package: ./publish
